[package]
name = "cpu-mem-overlay"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "cpu-mem-overlay"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
sysinfo = { version = "0.32", default-features = true }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
